name: Weekly CanAdapt Pipeline

on:
  schedule:
    # Toda segunda às 12:00 UTC ≈ 09:00 Brasília (UTC-3)
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      silver_partition:
        description: "Partição Silver opcional (ex: year=2026/month=07/day=15). Vazio = mais recente."
        required: false
        default: ""

concurrency:
  group: canadapt-weekly-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Bronze → Silver → Gold
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      # Evita prompts interativos do dbt
      DBT_PROFILES_DIR: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dbt packages
        run: python -m dbt deps --profiles-dir .

      - name: Prepare data directories
        run: |
          mkdir -p data/bronze data/silver data/gold data/silver/metadata

      - name: Restore Silver history from S3
        run: |
          BUCKET="${AWS_BUCKET_NAME:-$AWS_S3_BUCKET_NAME}"
          aws s3 sync "s3://${BUCKET}/bronze/wages/" data/bronze/wages/ --only-show-errors
          aws s3 sync "s3://${BUCKET}/silver/" data/silver/ --only-show-errors

      - name: Run CanAdapt pipeline
        env:
          SILVER_PARTITION: ${{ inputs.silver_partition }}
        run: |
          EXTRA_ARGS=()
          if [ -n "${SILVER_PARTITION}" ]; then
            EXTRA_ARGS+=(--silver-partition "${SILVER_PARTITION}")
          fi
          python scripts/run_pipeline.py "${EXTRA_ARGS[@]}"

      - name: Upload Gold artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canadapt-gold-${{ github.run_id }}
          path: |
            data/gold/canadapt_analytics.duckdb
            data/gold/parquet/
            data/metadata/runs/
          retention-days: 14
