name: 'canadapt'
version: '1.0.0'
config-version: 2
profile: 'canadapt_profile'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Por padrão, os stagings descobrem as partições e selecionam apenas a mais
# recente. Para reprocessamento, sobrescreva silver_partition no dbt run:
# --vars '{"silver_partition": "year=2026/month=07/day=15"}'
vars:
  silver_jobs_root: "data/silver/jobs"
  silver_cost_of_living_root: "data/silver/cost_of_living"
  silver_wages_root: "data/silver/wages"
  silver_partition: "year=*/month=*/day=*"
  wages_reference_year: "*"

models:
  canadapt:
    staging:
      +materialized: view
    marts:
      +materialized: table
